apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeiq-orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
      - name: orchestrator
        image: forgeiq:latest
        command: ["/app/orchestrator"]
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: TEMPORAL_HOSTPORT
          valueFrom:
            configMapKeyRef:
              name: forgeiq-config
              key: temporal_hostport
        - name: STORAGE_TYPE
          value: "postgres"
        - name: STORAGE_DSN
          valueFrom:
            secretKeyRef:
              name: forgeiq-secrets
              key: storage_dsn
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
spec:
  selector:
    app: orchestrator
  ports:
  - port: 80
    targetPort: 8080
  type: LoadBalancer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeiq-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: forgeiq:latest
        command: ["/app/worker"]
        env:
        - name: TEMPORAL_HOSTPORT
          valueFrom:
            configMapKeyRef:
              name: forgeiq-config
              key: temporal_hostport
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgeiq-config
data:
  temporal_hostport: "temporal:7233"
  storage_type: "postgres"

---
apiVersion: v1
kind: Secret
metadata:
  name: forgeiq-secrets
type: Opaque
stringData:
  storage_dsn: "postgres://user:password@postgres:5432/forgeiq?sslmode=disable"


